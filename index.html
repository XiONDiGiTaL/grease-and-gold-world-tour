// GREASE & GOLD: WORLD TOUR — 1.0 game code
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 480, H = 270;

// Sprite loading
const SPR = {};
let loaded = 0, total = 0;
function loadAll(cb) {
  for (const k in SPRITE_DATA) {
    SPR[k] = [];
    for (const uri of SPRITE_DATA[k]) {
      total++;
      const img = new Image();
      img.onload = () => { loaded++; if (loaded >= total) cb(); };
      img.onerror = () => { loaded++; if (loaded >= total) cb(); };
      img.src = uri;
      SPR[k].push(img);
    }
  }
  total++;
  const bg = new Image();
  bg.onload = () => { loaded++; BG.img = bg; if (loaded >= total) cb(); };
  bg.onerror = () => { loaded++; if (loaded >= total) cb(); };
  bg.src = BG_DATA;
  if (total === 0) cb();
}
const BG = { img: null };

// Input (edge-triggered press)
const keys = {};
const press = {};
const KEYMAP = {
  ArrowLeft:'L', KeyA:'L', ArrowRight:'R', KeyD:'R',
  ArrowUp:'U', KeyW:'U', ArrowDown:'D', KeyS:'D',
  KeyZ:'A', KeyX:'B', Space:'J', Enter:'S', Escape:'P',
  Digit1:'1', Digit2:'2', Digit3:'3'
};
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (!keys[k]) press[k] = 1; keys[k] = 1; }
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = 0;
});
canvas.addEventListener('pointerdown', () => { press['S'] = 1; });

// Touch
if ('ontouchstart' in window) {
  document.getElementById('touch').style.display = 'flex';
  const stick = document.getElementById('stick');
  const nub = document.getElementById('nub');
  let sid = null;
  stick.addEventListener('pointerdown', e => { sid = e.pointerId; try{stick.setPointerCapture(sid);}catch(_){} });
  stick.addEventListener('pointermove', e => {
    if (e.pointerId !== sid) return;
    const r = stick.getBoundingClientRect();
    let dx = (e.clientX - r.left - 50) / 50, dy = (e.clientY - r.top - 50) / 50;
    dx = Math.max(-1, Math.min(1, dx)); dy = Math.max(-1, Math.min(1, dy));
    nub.style.left = (30 + dx*30) + 'px'; nub.style.top = (30 + dy*30) + 'px';
    keys['L'] = dx < -0.3 ? 1 : 0; keys['R'] = dx > 0.3 ? 1 : 0;
    keys['U'] = dy < -0.3 ? 1 : 0; keys['D'] = dy > 0.3 ? 1 : 0;
  });
  const endStick = e => { if (e.pointerId === sid) { sid = null; nub.style.left='30px'; nub.style.top='30px'; keys['L']=keys['R']=keys['U']=keys['D']=0; } };
  stick.addEventListener('pointerup', endStick);
  stick.addEventListener('pointercancel', endStick);
  const bind = (id, k) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); press[k]=1; keys[k]=1; });
    el.addEventListener('pointerup', () => keys[k]=0);
    el.addEventListener('pointercancel', () => keys[k]=0);
  };
  bind('bAtk','A'); bind('bSpc','B'); bind('bJmp','J');
}

function newFoe(type, x, y) {

}

// --- physics helpers: velocity-based, Genesis-style weight ---
function physFoe(f, wantX, wantY) {
  // accelerate toward desired velocity (weighty), friction when stopping
  const a = 0.22 / Math.sqrt(f.wt);
  f.vx += (wantX - f.vx) * a;
  f.vy += (wantY - f.vy) * a;
  f.x += f.vx;
  f.y += f.vy;
  f.x = Math.max(30, Math.min(950, f.x));
  f.y = Math.max(185, Math.min(245, f.y));
}
function physFoeFriction(f, rate) {
  f.vx *= rate; f.vy *= rate;
  f.x += f.vx; f.y += f.vy;
  f.x = Math.max(30, Math.min(950, f.x));
  f.y = Math.max(185, Math.min(245, f.y));
}

// Combat — all fixed-step, no timers
function hurtFoe(f, dmg, kx, ax, launch) {
  if (f.inv > 0 || f.hp <= 0) return;
  if (!launch && f.type === 'exec' && Math.sign(ax - f.x) === f.face && Math.random() < 0.35) {
    G.fx.push({ x:f.x, y:f.y-60, t:0, kind:'block' });
    f.vx = kx * 0.3 / f.wt;
    return;
  }
  f.hp -= dmg;
  f.inv = 10;
  // momentum impulse, scaled by weight — heavy hits launch
  f.vx = kx / Math.sqrt(f.wt);
  f.vy = (Math.random() - 0.5) * 1.2;
  if (launch) {
    f.st = 'launched'; f.t = 0;
    f.vx = kx * 1.8 / Math.sqrt(f.wt);
    G.shake = 8; G.freeze = 8;
    G.fx.push({ x:f.x, y:f.y-50, t:0, kind:'launch' });
  } else if (f.type !== 'heavy' || f.hp <= 0) {
    f.st = 'hurt'; f.t = 0;
    G.shake = 4; G.freeze = 4;
  }
  G.fx.push({ x:f.x, y:f.y-50, t:0, kind:'hit' });
  G.player.hype = Math.min(100, G.player.hype + 5);
  if (f.hp <= 0) {
    f.hp = 0; f.st = 'down'; f.t = 0;
    // death launch: fly back then crumple
    f.vx = kx * 1.5 / Math.sqrt(f.wt);
    G.score += 100;
    G.player.hype = Math.min(100, G.player.hype + 12);
    if (Math.random() < 0.3) G.fx.push({ x:f.x, y:f.y, t:0, kind:'kebab' });
  }
}

function hurtPlayer(dmg, kx) {
  const p = G.player;
  if (p.inv > 0 || p.hp <= 0 || p.z > 25) return;
  p.hp -= dmg;
  p.inv = 25;
  p.vx = kx;
  p.vy = (Math.random() - 0.5);
  p.st = 'hurt'; p.t = 0;
  G.shake = 5; G.freeze = 5;
  if (p.hp <= 0) p.hp = 0;
}

function playerAttack() {
  const p = G.player;
  if (p.st === 'attack') {
    if (p.atkT > 8) p.atkBuf = true;
    return;
  }
  if (p.st !== 'idle' && p.st !== 'walk') return;
  p.st = 'attack'; p.specAtk = false; p.atkT = 0; p.atkBuf = false;
  p.inv = Math.max(p.inv, 12);
}

function doAttackHit() {
  const p = G.player;
  const reach = 60;
  const hx = p.x + p.face * reach;
  const finisher = (p.atkN === 2);
  for (const f of G.foes) {
    if (f.hp <= 0) continue;
    const dx = Math.abs(f.x - hx);
    const dy = Math.abs(f.y - p.y);
    if (dx < 40 && dy < 30 && Math.sign(f.x - p.x) === p.face) {
      hurtFoe(f, p.atk + p.atkN * 4, p.face * (finisher ? 7 : 4), p.x, finisher);
    }
  }
  G.fx.push({ x:hx, y:p.y-50, t:0, kind:'slash', face:p.face });
  p.atkN = (p.atkN + 1) % 3;
}

function playerSpecial() {
  const p = G.player;
  if (p.hype < 30 || (p.st !== 'idle' && p.st !== 'walk')) return;
  p.hype -= 30;
  p.st = 'attack'; p.specAtk = true; p.atkT = 0; p.atkBuf = false;
  G.fx.push({ x:p.x, y:p.y-50, t:0, kind:'spec', txt:p.spec });
  G.shake = 8;
}

function doSpecialHit() {
  const p = G.player;
  for (const f of G.foes) {
    if (f.hp <= 0) continue;
    if (Math.abs(f.x - p.x) < 85 && Math.abs(f.y - p.y) < 32) {
      hurtFoe(f, 30, (f.x > p.x ? 1 : -1) * 8, p.x, true);
    }
  }
}

function spawnWave() {
  G.wave++;
  if (G.wave === 1) {
    G.foes.push(newFoe('guard', 620, 205), newFoe('guard', 700, 228), newFoe('guard', 780, 212));
    G.msg = 'WAVE 1'; G.msgT = 90;
  } else if (G.wave === 2) {
    G.foes.push(newFoe('exec', 640, 210), newFoe('exec', 740, 225), newFoe('heavy', 840, 215));
    G.msg = 'WAVE 2'; G.msgT = 90;
  } else if (G.wave === 3) {
    G.foes.push(newFoe('ledger', 760, 215), newFoe('guard', 660, 228));
    G.msg = 'LEDGER'; G.msgT = 120;
  }
}

function startFight() {
  G.player = newPlayer(CHARS[G.sel].key);
  G.foes = []; G.fx = []; G.wave = 0; G.score = 0; G.spawnT = 0; G.camX = 0;
  spawnWave();
  G.state = 'fight';
}

function update() {
  G.t++;
  if (G.freeze > 0) { G.freeze--; return; }
  if (G.shake > 0) G.shake *= 0.9;

  const pr = {...press};
  for (const k in press) press[k] = 0;

  if (G.state === 'title') {
    if (pr['S']) G.state = 'select';
  } else if (G.state === 'select') {
    if (pr['L']) G.sel = (G.sel + 2) % 3;
    if (pr['R']) G.sel = (G.sel + 1) % 3;
    if (pr['1']) { G.sel = 0; startFight(); }
    else if (pr['2']) { G.sel = 1; startFight(); }
    else if (pr['3']) { G.sel = 2; startFight(); }
    else if (pr['S'] || pr['A']) startFight();
  } else if (G.state === 'fight') {
    updateFight(pr);
  } else if (G.state === 'pause') {
    if (pr['P']) G.state = 'fight';
  } else if (G.state === 'clear' || G.state === 'over') {
    if (pr['S']) { G.state = 'title'; G.sel = 0; G.lives = 3; G.camX = 0; }
  }

  for (let i = G.fx.length - 1; i >= 0; i--) {
    G.fx[i].t++;
    if (G.fx[i].t > 40) G.fx.splice(i, 1);
  }
  if (G.msgT > 0) G.msgT--;
  if (G.spawnT > 0) {
    G.spawnT--;
    if (G.spawnT === 0) spawnWave();
  }
}

function attackersOut() {
  let n = 0;
  for (const f of G.foes) {
    if (f.hp > 0 && (f.st === 'attack' || f.st === 'tele' || f.st === 'charge')) n++;
  }
  return n;
}

function updateFight(pr) {
  const p = G.player;
  if (!p || p.hp <= 0) {
    G.lives--;
    if (G.lives <= 0) { G.state = 'over'; return; }
    p.hp = p.maxhp; p.x = 100; p.y = 215; p.vx = 0; p.vy = 0; p.st = 'idle'; p.inv = 60;
    return;
  }

  const mx = (keys['R'] ? 1 : 0) - (keys['L'] ? 1 : 0);
  const my = (keys['D'] ? 1 : 0) - (keys['U'] ? 1 : 0);
  if (p.st === 'idle' || p.st === 'walk') {
    if (mx || my) {
      p.st = 'walk';
      // eased movement: accelerate toward input, friction on release
      p.vx += (mx * p.spd - p.vx) * 0.35;
      p.vy += (my * p.spd * 0.7 - p.vy) * 0.35;
      if (mx) p.face = mx > 0 ? 1 : -1;
    } else {
      p.st = 'idle';
      p.vx *= 0.7; p.vy *= 0.7;
    }
    p.x = Math.max(30, Math.min(950, p.x + p.vx));
    p.y = Math.max(185, Math.min(245, p.y + p.vy));
  } else if (p.st === 'hurt') {
    p.t++;
    physFoeFriction(p, 0.88);
    if (p.t > 18) { p.st = 'idle'; p.t = 0; }
  }

  if (p.st === 'attack') {
    p.atkT++;
    if (!p.specAtk && p.atkT === 8) doAttackHit();
    if (p.specAtk && p.atkT === 12) doSpecialHit();
    const dur = p.specAtk ? 30 : 18;
    if (p.atkT >= dur) {
      if (p.atkBuf && !p.specAtk) {
        p.atkT = 0; p.atkBuf = false; p.inv = Math.max(p.inv, 12);
      } else { p.st = 'idle'; p.atkT = 0; p.atkN = 0; }
    }
  }

  if (pr['A']) playerAttack();
  if (pr['B']) playerSpecial();
  if (pr['J'] && p.z === 0 && (p.st === 'idle' || p.st === 'walk')) {
    p.vz = 6; p.z = 1;
  }
  if (pr['P']) G.state = 'pause';

  if (p.z > 0 || p.vz !== 0) {
    p.z += p.vz; p.vz -= 0.4;
    if (p.z <= 0) { p.z = 0; p.vz = 0; }
  }
  if (p.inv > 0) p.inv--;

  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i];
    if (f.kind === 'kebab' && p.hp < p.maxhp && Math.abs(f.x - p.x) < 25 && Math.abs(f.y - p.y) < 20) {
      p.hp = Math.min(p.maxhp, p.hp + 30);
      G.fx.splice(i, 1);
    }
  }

  for (const f of G.foes) {
    if (f.hp <= 0) {
      f.t++;
      // corpses slide with friction then rest
      if (f.st === 'down') physFoeFriction(f, 0.92);
      continue;
    }
    f.t++;
    if (f.inv > 0) f.inv--;
    f.face = (p.x - f.x) > 0 ? 1 : -1;

    if (f.st === 'hurt') {
      physFoeFriction(f, 0.88);
      if (f.t > 15) { f.st = 'idle'; f.t = 0; f.mode = 'hold'; }
      continue;
    }
    if (f.st === 'launched') {
      physFoeFriction(f, 0.94);
      if (Math.abs(f.vx) < 0.8 && Math.abs(f.vy) < 0.8) { f.st = 'ko'; f.t = 0; }
      continue;
    }
    if (f.st === 'ko') {
      if (f.t > 45) { f.st = 'idle'; f.t = 0; f.mode = 'hold'; f.aiT = 30; }
      continue;
    }

    const dx = p.x - f.x, dy = p.y - f.y;
    const dist = Math.abs(dx);

    if (f.st === 'tele') {
      if (f.t > 30) { f.st = 'charge'; f.t = 0; }
      continue;
    }
    if (f.st === 'charge') {
      f.vx = f.face * 4.5; f.vy = 0;
      f.x += f.vx;
      f.x = Math.max(30, Math.min(950, f.x));
      if (Math.abs(f.x - p.x) < 32 && Math.abs(f.y - p.y) < 22) {
        hurtPlayer(f.atk, f.face * 7);
      }
      if (f.t > 26) { f.st = 'idle'; f.t = 0; f.atkCd = 150; f.vx = 0; f.mode = 'hold'; f.aiT = 40; }
      continue;
    }

    if (f.st === 'attack') {
      // mid-swing: friction, let the animation play out
      physFoeFriction(f, 0.8);
    } else {
      // Paced brain: advance -> hold -> strafe -> strike
      if (f.mode === undefined) {
        f.mode = 'hold';
        f.aiT = 40 + Math.random() * 70;
        f.offY = Math.random() * 36 - 18;
        f.strafeDir = Math.random() < 0.5 ? 1 : -1;
      }
      f.aiT--;
      const laneDy = (p.y + f.offY) - f.y;
      const inRange = dist <= f.reach && Math.abs(dy) < 20;

      if (f.mode === 'hold') {
        f.st = 'idle';
        physFoe(f, 0, 0);
        if (f.aiT <= 0) {
          f.mode = inRange ? 'strafe' : 'advance';
          f.aiT = 45 + Math.random() * 55;
        }
      } else if (f.mode === 'strafe') {
        f.st = 'walk';
        if (f.y <= 190 || f.y >= 240) f.strafeDir *= -1;
        else if (Math.random() < 0.015) f.strafeDir *= -1;
        let tx = 0;
        if (dist > f.reach + 34) tx = Math.sign(dx) * f.spd * 0.5;
        else if (dist < f.reach - 12) tx = -Math.sign(dx) * f.spd * 0.4;
        physFoe(f, tx, f.strafeDir * f.spd * 0.45);
        if (f.aiT <= 0) { f.mode = 'advance'; f.aiT = 55 + Math.random() * 60; }
      } else { // advance
        f.st = 'walk';
        const ty = Math.abs(laneDy) > 8 ? Math.sign(laneDy) * f.spd * 0.5 : 0;
        physFoe(f, Math.sign(dx) * f.spd, ty);
        if (inRange || f.aiT <= 0) { f.mode = 'hold'; f.aiT = 25 + Math.random() * 45; }
      }

      if (inRange && f.atkCd <= 0 && attackersOut() < 2) {
        if (f.type === 'heavy') {
          f.st = 'tele'; f.t = 0;
          G.fx.push({ x:f.x, y:f.y - f.h - 14, t:0, kind:'warn' });
        } else {
          f.st = 'attack'; f.t = 0;
          f.atkCd = 120;
          f.atkCount++;
          if (f.type === 'ledger' && f.atkCount % 3 === 0) {
            G.fx.push({ x:f.x, y:f.y-40, t:0, kind:'slam' });
            G.shake = 8;
            if (Math.abs(p.x - f.x) < 75 && Math.abs(p.y - f.y) < 30) hurtPlayer(20, (p.x > f.x ? 1 : -1) * 7);
          } else {
            if (p.inv <= 0 && p.z < 20) hurtPlayer(f.atk, (p.x > f.x ? 1 : -1) * 5);
          }
        }
      }
    }
    if (f.st === 'attack' && f.t > 25) { f.st = 'idle'; f.t = 0; f.mode = 'hold'; f.aiT = 30 + Math.random() * 40; }
    if (f.atkCd > 0) f.atkCd--;

    for (const o of G.foes) {
      if (o === f || o.hp <= 0) continue;
      const ox = f.x - o.x, oy = f.y - o.y;
      const d = Math.hypot(ox, oy);
      if (d < 48 && d > 0.5) {
        f.x += (ox / d) * 1.4;
        f.y = Math.max(185, Math.min(245, f.y + (oy / d) * 1.0));
      }
    }
  }

  const alive = G.foes.some(f => f.hp > 0);
  const settling = G.foes.some(f => f.hp <= 0 && f.t < 60);
  if (!alive && !settling && G.spawnT === 0) {
    if (G.wave < 3) { G.spawnT = 70; G.msg = 'WAVE ' + (G.wave + 1); G.msgT = 70; }
    else G.state = 'clear';
  }

  G.camX = Math.max(0, Math.min(520, p.x - 200));
}

function drawSprite(key, frame, x, y, face, h, rock) {
  const imgs = SPR[key];
  if (!imgs || !imgs[frame]) return;
  const img = imgs[frame];
  if (!img.complete || img.naturalWidth === 0) return;
  const s = h / img.naturalHeight;
  const w = img.naturalWidth * s;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (rock) ctx.rotate(rock);
  ctx.scale(face, 1);
  ctx.drawImage(img, Math.round(-w/2), Math.round(-h), Math.round(w), Math.round(h));
  ctx.restore();
}

function drawBackground() {
  if (BG.img && BG.img.complete && BG.img.naturalWidth) {
    ctx.drawImage(BG.img, Math.round(-G.camX), 0, 1000, 270);
  } else {
    ctx.fillStyle = '#0a0a18'; ctx.fillRect(0, 0, W, H);
  }
  const sx = 150 - G.camX;
  if (sx > -220 && sx < W + 20) {
    ctx.fillStyle = '#c9a227'; ctx.fillRect(sx, 42, 200, 30);
    ctx.fillStyle = '#1a1000'; ctx.fillRect(sx+4, 46, 192, 22);
    ctx.fillStyle = '#c9a227'; ctx.textAlign = 'center'; ctx.font = 'bold 11px monospace';
    ctx.fillText('GREASE & GOLD', sx + 100, 61);
  }
  const bx = 640 - G.camX;
  if (bx > -180 && bx < W + 20) {
    ctx.fillStyle = '#5b2a86'; ctx.fillRect(bx, 46, 170, 64);
    ctx.fillStyle = '#7a3fb0'; ctx.fillRect(bx, 46, 170, 6);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx+55, 72, 14, 0, 7); ctx.fill();
    ctx.fillStyle = '#f0f';
    ctx.beginPath(); ctx.arc(bx+75, 72, 14, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx+55, 72, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(bx+48, 82, 6, 8); ctx.fillStyle = '#f0f'; ctx.fillRect(bx+76, 82, 6, 8);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SOHBET', bx + 118, 80);
  }
}

function draw() {
  ctx.save();
  if (G.shake > 0.5) ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);

  if (G.state === 'load') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '20px monospace';
    ctx.fillText('GREASE & GOLD', W/2, 120);
    ctx.font = '12px monospace';
    ctx.fillText('Loading... ' + loaded + '/' + total, W/2, 150);
  } else if (G.state === 'title') {
    drawBackground();
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c9a227'; ctx.font = 'bold 30px monospace';
    ctx.fillText('GREASE & GOLD', W/2, 100);
    ctx.fillText('WORLD TOUR', W/2, 132);
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace';
    ctx.fillText('By Player529 & XiØN', W/2, 160);
    ctx.fillStyle = '#c9a227';
    if (Math.floor(G.t / 30) % 2 === 0) ctx.fillText('Press ENTER or TAP', W/2, 205);
    ctx.fillStyle = '#888'; ctx.font = '10px monospace';
    ctx.fillText('Arrows/WASD move · Z attack · X special · Space jump', W/2, 240);
    ctx.fillStyle = '#444'; ctx.font = '9px monospace';
    ctx.fillText('build 2026-10-12f', W/2, 258);
  } else if (G.state === 'select') {
    drawBackground();
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('SELECT FIGHTER', W/2, 40);
    CHARS.forEach((c, i) => {
      const x = 90 + i * 150;
      const sel = i === G.sel;
      if (sel) { ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3; ctx.strokeRect(x-60, 55, 120, 150); }
      drawSprite(c.key, 0, x, 185, 1, 84);
      ctx.fillStyle = sel ? '#c9a227' : '#fff';
      ctx.font = 'bold 10px monospace';
      ctx.fillText(c.name, x, 215);
      ctx.fillStyle = '#888'; ctx.font = '10px monospace';
      ctx.fillText('HP ' + c.hp + ' ATK ' + c.atk, x, 228);
    });
    ctx.fillStyle = '#888'; ctx.font = '10px monospace';
    ctx.fillText('Arrows / 1-2-3 + Enter', W/2, 255);
  } else if (G.state === 'fight' || G.state === 'pause') {
    drawBackground();
    drawFight();
    if (G.state === 'pause') {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 20px monospace';
      ctx.fillText('PAUSED', W/2, 130);
      ctx.font = '11px monospace';
      ctx.fillText('ESC to resume', W/2, 155);
    }
  } else if (G.state === 'clear') {
    drawBackground();
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f0'; ctx.textAlign = 'center'; ctx.font = 'bold 24px monospace';
    ctx.fillText('STAGE CLEAR!', W/2, 120);
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('Score: ' + G.score, W/2, 150);
    if (Math.floor(G.t / 30) % 2 === 0) ctx.fillText('Press ENTER', W/2, 185);
  } else if (G.state === 'over') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f00'; ctx.textAlign = 'center'; ctx.font = 'bold 24px monospace';
    ctx.fillText('GAME OVER', W/2, 120);
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('Score: ' + G.score, W/2, 150);
    if (Math.floor(G.t / 30) % 2 === 0) ctx.fillText('Press ENTER', W/2, 185);
  }

  ctx.restore();
}

function drawFight() {
  const p = G.player;
  if (!p) return;

  const actors = [p, ...G.foes.filter(f => f.hp > 0 || f.t < 60)].sort((a, b) => a.y - b.y);

  for (const a of actors) {
    const isP = a === p;
    const key = isP ? a.key : a.type;
    let frame = 0;
    if (a.st === 'walk') {
      frame = isP ? ((Math.floor(G.t / 12) % 2 === 0) ? 1 : 0) : 0;
    } else if (a.st === 'attack' || a.st === 'tele' || a.st === 'charge') {
      frame = isP ? 2 : 1;
    } else if (a.st === 'hurt' || a.st === 'down' || a.st === 'launched' || a.st === 'ko') {
      frame = isP ? 3 : 0;
    }

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(a.x - G.camX, a.y + 2, 18, 5, 0, 0, 7); ctx.fill();

    const h = isP ? 84 : (a.h || 84);
    // Enemy walk cycle: bob + rock reads as stepping; launched foes tumble
    let bobY = 0, lungeX = 0, rock = 0;
    if (!isP && a.st === 'walk') {
      const ph = Math.floor(G.t / 7) % 2 === 0;
      bobY = ph ? 0 : -5;
      rock = ph ? 0.05 : -0.05;
    }
    if (a.st === 'launched') rock = (G.t * 0.3) % (Math.PI * 2) > Math.PI ? 0.35 : -0.35;
    if (!isP && a.st === 'attack' && a.t < 12) lungeX = a.face * 5;
    if (isP && a.st === 'attack' && !a.specAtk && p.atkT < 10) lungeX = a.face * 4;
    ctx.save();
    if (a.inv > 0 && Math.floor(G.t / 3) % 2 === 0) ctx.globalAlpha = 0.5;
    if (a.st === 'tele' && Math.floor(G.t / 4) % 2 === 0) ctx.globalAlpha = 0.7;
    drawSprite(key, frame, a.x - G.camX + lungeX, a.y - (a.z || 0) + bobY, a.face, h, rock);
    ctx.restore();

    if (!isP && a.hp > 0) {
      const w = 44;
      ctx.fillStyle = '#400'; ctx.fillRect(a.x - G.camX - w/2, a.y - h - 12, w, 5);
      ctx.fillStyle = a.type === 'ledger' || a.type === 'heavy' ? '#f80' : '#f00';
      ctx.fillRect(a.x - G.camX - w/2, a.y - h - 12, w * (a.hp / a.maxhp), 5);
    }
  }

  for (const f of G.fx) {
    const fx = f.x - G.camX, fy = f.y;
    if (f.kind === 'slash') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(fx, fy, 16 + f.t * 2, 0, 6); ctx.stroke();
    } else if (f.kind === 'hit') {
      ctx.fillStyle = '#ff0';
      ctx.fillRect(fx - 4, fy - 4, 8, 8);
    } else if (f.kind === 'launch') {
      ctx.fillStyle = '#ff0'; ctx.textAlign = 'center'; ctx.font = 'bold 14px monospace';
      ctx.fillText('SMASH!', fx, fy - f.t * 2);
    } else if (f.kind === 'kebab') {
      ctx.fillStyle = '#a52a2a'; ctx.fillRect(fx - 8, fy - 4, 16, 8);
      ctx.fillStyle = '#d2691e'; ctx.fillRect(fx - 8, fy - 4, 16, 3);
    } else if (f.kind === 'spec') {
      ctx.fillStyle = '#c9a227'; ctx.textAlign = 'center'; ctx.font = 'bold 14px monospace';
      ctx.fillText(f.txt, fx, fy - f.t);
    } else if (f.kind === 'block') {
      ctx.strokeStyle = '#4af'; ctx.lineWidth = 2;
      ctx.strokeRect(fx - 12, fy - 8, 24, 16);
      ctx.fillStyle = '#4af'; ctx.textAlign = 'center'; ctx.font = '9px monospace';
      ctx.fillText('BLOCK', fx, fy - 12);
    } else if (f.kind === 'warn') {
      ctx.fillStyle = '#f00'; ctx.textAlign = 'center'; ctx.font = 'bold 16px monospace';
      ctx.fillText('!', fx, fy - (f.t % 8));
    } else if (f.kind === 'slam') {
      ctx.strokeStyle = '#f80'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(fx, fy, 20 + f.t * 3, 0, 6); ctx.stroke();
    }
  }

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 28);
  drawSprite(p.key, 0, 20, 26, 1, 24);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
  ctx.fillText(p.name, 36, 12);
  ctx.fillStyle = '#400'; ctx.fillRect(36, 15, 120, 8);
  ctx.fillStyle = p.hp > 30 ? '#0f0' : '#f00';
  ctx.fillRect(36, 15, 120 * (p.hp / p.maxhp), 8);
  ctx.fillStyle = '#220'; ctx.fillRect(36, 24, 80, 4);
  ctx.fillStyle = '#c9a227'; ctx.fillRect(36, 24, 80 * (p.hype / 100), 4);

  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '10px monospace';
  ctx.fillText('WAVE ' + Math.max(1, G.wave) + '/3', W/2, 18);
  ctx.textAlign = 'right';
  ctx.fillText('SCORE ' + G.score, W - 10, 12);
  ctx.fillText('LIVES x' + G.lives, W - 10, 24);

  if (G.msgT > 0) {
    ctx.fillStyle = '#c9a227'; ctx.textAlign = 'center'; ctx.font = 'bold 20px monospace';
    ctx.fillText(G.msg, W/2, 100);
  }

  const boss = G.foes.find(f => f.type === 'ledger' && f.hp > 0);
  if (boss) {
    ctx.fillStyle = '#400'; ctx.fillRect(W/2 - 100, H - 20, 200, 10);
    ctx.fillStyle = '#f00'; ctx.fillRect(W/2 - 100, H - 20, 200 * (boss.hp / boss.maxhp), 10);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 10px monospace';
    ctx.fillText('LEDGER', W/2, H - 24);
  }
}

let last = 0, acc = 0;
const STEP = 1000 / 60; // fixed 60Hz logic, independent of display refresh rate
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 250) dt = 250;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 4) {
    update();
    acc -= STEP;
    n++;
  }
  draw();
}

loadAll(() => {
  G.state = 'title';
  requestAnimationFrame(loop);
});

</script>
