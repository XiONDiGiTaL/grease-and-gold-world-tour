(function (G) {
'use strict';

G.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
G.lerp = (a, b, t) => a + (b - a) * t;
G.sgn = (v) => v < 0 ? -1 : 1;
G.rnd = (a, b) => a + Math.random() * (b - a);
G.pick = (arr, r) => arr[Math.floor((r || Math.random)() * arr.length)];
G.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
G.ease = (t) => t * t * (3 - 2 * t);

G.rgb = (hex) => 0xFF000000 | ((hex & 0xFF) << 16) | (hex & 0xFF00) | ((hex >> 16) & 0xFF);

/* ---------- 5x7 pixel font (rows as 5-bit binary strings) ---------- */
const F = {

Object.keys(F).forEach(k => { GLYPH[k] = F[k].split(',').map(r => parseInt(r, 2)); });
const UPPER = {};
Object.keys(GLYPH).forEach(k => { const u = k.toUpperCase(); if (u !== k && !GLYPH[u]) UPPER[k] = GLYPH[k]; });

/** Width in font-pixels of a string at scale 1 (5px glyph + 1px gap). */
function textWidth(s, size) {
  const sc = size / 7;
  let w = 0;
  for (const ch of String(s)) w += (GLYPH[ch] || UPPER[ch] ? 5 : 5) + 1;
  return Math.max(0, (w - 1) * sc);
}
G.textWidth = textWidth;

/** Draw text on a Canvas2D context. Size = pixel height of a glyph. */
G.text = function (ctx, str, x, y, size, color, align, outline) {
  const sc = Math.max(1, Math.round(size / 7));
  const w = textWidth(str, sc * 7);
  let px = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  const py = Math.round(y);
  const chars = [...String(str)];
  if (outline) {
    ctx.fillStyle = outline;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      if (!ox && !oy) continue;
      drawRun(ctx, chars, px + ox * sc, py + oy * sc, sc);
    }
  }
  ctx.fillStyle = color;
  drawRun(ctx, chars, px, py, sc);
  return w;
};
function drawRun(ctx, chars, px, py, sc) {
  let x = px;
  for (const ch of chars) {
    const gl = GLYPH[ch] || UPPER[ch];
    if (gl) {
      for (let r = 0; r < 7; r++) {
        const row = gl[r];
        if (!row) continue;
        let run = -1;
        for (let c = 0; c <= 5; c++) {
          const on = c < 5 && (row & (1 << (4 - c)));
          if (on && run < 0) run = c;
          else if (!on && run >= 0) { ctx.fillRect(x + run * sc, py + r * sc, (c - run) * sc, sc); run = -1; }
        }
      }
    }
    x += 6 * sc;
  }
}

    clipRect(a, hx + r * .18, hy + r * .46, r * .4, Math.max(1, r * .07), pal.lip.sh);
  } else if (kit.face === 'jowls') {
    clipRect(a, hx + r * .1, hy + r * .42, r * .5, Math.max(1, r * .12), kit.skin.dk);
    clipRect(a, hx + r * .52, hy + r * .38, r * .16, r * .18, kit.skin.sh);
  } else if (kit.face === 'glasses') {
    clipRect(a, ex - r * .5, ey - r * .2, r * .48, r * .3, pal.gold ? pal.gold.hi : 0xd8b040);
    clipRect(a, ex + r * .14, ey - r * .2, r * .42, r * .3, pal.gold ? pal.gold.hi : 0xd8b040);
    clipRect(a, ex - r * .42, ey - r * .16, r * .34, r * .22, 0x2a3038);
    clipRect(a, ex + r * .2, ey - r * .16, r * .3, r * .22, 0x2a3038);
  } else if (kit.face === 'stubble') {
    clipEllipse(a, hx + r * .2, hy + r * .55, r * .62, r * .4, kit.skin.sh);
    clipRect(a, hx + r * .1, hy + r * .66, r * .2, Math.max(1, r * .14), OUT);
  } else if (kit.face === 'plain') {
    clipRect(a, hx + r * .2, hy + r * .48, r * .38, Math.max(1, r * .1), kit.skin.dk);
  }
  /* nose */
  clipRect(a, hx + r * .78, hy + r * .12, Math.max(1, r * .16), Math.max(1, r * .22), kit.skin.sh);
  /* brow shadow + chin line give the face a readable structure at 1x */
  clipRect(a, hx + r * .1, hy - r * .44, r * .72, Math.max(1, r * .08), kit.skin.sh);
  if (kit.face !== 'box') clipRect(a, hx + r * .16, hy + r * .8, r * .5, Math.max(1, r * .07), kit.skin.dk);
}

/* ---------------- weapons ---------------- */
function weapon(ax, ay, angDeg, len, pal, kind) {
  const ang = angDeg * Math.PI / 180, dx = Math.cos(ang), dy = Math.sin(ang);
  return { x: ax, y: ay, dx: dx, dy: dy, len: len, pal: pal, kind: kind,
    at: (t) => ({ x: ax + dx * len * t, y: ay + dy * len * t }) };
}
function drawWeapon(a, kit, J, P) {
  const s = kit.b.s, pal = kit.pal;
  const hand = J.armF.ha;
  const ang = P.wpn;
  const w = weapon(hand.x, hand.y, ang, 1, pal, kit.weapon);
  if (kit.weapon === 'flag') {
    const L = 46 * s, tipx = hand.x + Math.cos(ang * Math.PI / 180) * L, tipy = hand.y + Math.sin(ang * Math.PI / 180) * L;
    capsule(a, hand.x, hand.y, tipx, tipy, 1.6 * s, 1.5 * s, pal.steel);
    disc(a, tipx, tipy, 2.4 * s, pal.gold.base);
    disc(a, tipx - .7, tipy - .8, 1.1 * s, pal.gold.hi);
    /* flag cloth: rectangle hanging off the pole, waving */
    const bx = hand.x + Math.cos(ang * Math.PI / 180) * L * .72, by = hand.y + Math.sin(ang * Math.PI / 180) * L * .72;
    const wave = Math.sin((kit._f || 0) * 1.3) * 2.2;
    const nx = -Math.sin(ang * Math.PI / 180), ny = Math.cos(ang * Math.PI / 180);
    const fw = 21 * s, fh = 16 * s;
    const p1 = { x: bx, y: by }, p2 = { x: bx + nx * fw * .55, y: by + ny * fw * .55 };
    const p3 = { x: bx + nx * fw + Math.cos(ang * Math.PI / 180) * fh * .2 + wave, y: by + ny * fw + Math.sin(ang * Math.PI / 180) * fh * .2 };
    const p4 = { x: p3.x - nx * fw * .45, y: p3.y - ny * fw * .45 };
    poly(a, [[p1.x, p1.y], [p2.x, p2.y], [p3.x, p3.y], [p4.x, p4.y]], pal.flag.base);
    poly(a, [[p1.x, p1.y], [p2.x, p2.y], [p2.x - nx * 2 + wave * .4, p2.y - ny * 2], [p1.x - nx * 2 + wave * .4, p1.y - ny * 2]], pal.flag.hi);
    poly(a, [[p3.x, p3.y], [p4.x, p4.y], [p4.x - nx * 2, p4.y - ny * 2], [p3.x - nx * 2, p3.y - ny * 2]], pal.flag.sh);
    /* crescent + star */
    const cxm = (p1.x + p3.x) / 2 - nx * 1.5, cym = (p1.y + p3.y) / 2 - ny * 1.5;
    disc(a, cxm, cym, 3.7 * s, pal.white.base);
    disc(a, cxm + 1.5 * s, cym - .4 * s, 2.9 * s, pal.flag.base);
    rect(a, cxm + 2.9 * s, cym - 1.7 * s, 1.9 * s, 1.9 * s, pal.white.base);
  } else if (kit.weapon === 'mic') {
    const r = ang * Math.PI / 180, hx = hand.x + Math.cos(r) * 4 * s, hy = hand.y + Math.sin(r) * 4 * s;
    capsule(a, hand.x, hand.y, hx, hy, 2.0 * s, 1.8 * s, pal.mic);
    const ex = hx + Math.cos(r) * 5.8 * s, ey = hy + Math.sin(r) * 5.8 * s;
    disc(a, ex, ey, 4.4 * s, pal.mic.base);
    disc(a, ex - 1.1 * s, ey - 1.3 * s, 2.1 * s, pal.mic.hi);
    clipEllipse(a, ex + 1.4 * s, ey + 1.5 * s, 1.9 * s, 1.5 * s, pal.mic.sh);
    /* mesh bands */
    for (let i = -1; i <= 1; i++) {
      const px = ex + Math.cos(r + Math.PI / 2) * i * 2.1 * s, py = ey + Math.sin(r + Math.PI / 2) * i * 2.1 * s;
      put(a, px, py, pal.mic.dk);
    }
    /* cable from mic to the hip */
    const hipP = J.hip, c0 = { x: ex, y: ey }, c1 = { x: (ex + hipP.x) / 2 - 6 * s, y: (ey + hipP.y) / 2 + 16 * s }, c2 = { x: hipP.x - 2 * s, y: hipP.y + 6 * s };
    let lx = c0.x, ly = c0.y;
    for (let i = 1; i <= 16; i++) {
      const t = i / 16, it = 1 - t;
      const x = it * it * c0.x + 2 * it * t * c1.x + t * t * c2.x;
      const y = it * it * c0.y + 2 * it * t * c1.y + t * t * c2.y;
      line(a, lx, ly, x, y, pal.cord.base); lx = x; ly = y;
    }
  } else if (kit.weapon === 'salami') {
    const r = ang * Math.PI / 180;
    const L = 38 * s, half = 7.3 * s;
    capsule(a, hand.x - Math.cos(r) * 5 * s, hand.y - Math.sin(r) * 5 * s, hand.x + Math.cos(r) * (L - 2), hand.y + Math.sin(r) * (L - 2), half * .8, half, pal.salami);
    /* rounded cut end + string */
    const ex = hand.x + Math.cos(r) * (L - 2), ey = hand.y + Math.sin(r) * (L - 2);
    disc(a, ex, ey, half * .96, pal.salami.base);
    clipEllipse(a, ex - 1.2 * s, ey - 1.2 * s, half * .5, half * .5, pal.speck.base);
    clipEllipse(a, ex + .6 * s, ey + 1.4 * s, half * .34, half * .34, pal.speck.sh);
    for (let i = 0; i < 9; i++) {
      const t = .14 + (i % 5) * .17, off = (i % 3 - 1) * half * .45;
      const px = hand.x + Math.cos(r) * L * t - Math.sin(r) * off, py = hand.y + Math.sin(r) * L * t + Math.cos(r) * off;
      put(a, px, py, pal.speck.base); if (i % 2) put(a, px + 1, py, pal.speck.sh);
    }
    /* the far hand is aimed onto the salami by renderFrame (see gripArm) */
  } else if (kit.weapon === 'baton') {
    const r = ang * Math.PI / 180;
    const bt = pal.mic || pal.steel || pal.suit || pal.coat || pal.vest;
    capsule(a, hand.x, hand.y, hand.x + Math.cos(r) * 16 * s, hand.y + Math.sin(r) * 16 * s, 1.8 * s, 1.6 * s, bt);
    capsule(a, hand.x + Math.cos(r) * 14 * s, hand.y + Math.sin(r) * 14 * s, hand.x + Math.cos(r) * 17 * s, hand.y + Math.sin(r) * 17 * s, 2.1 * s, 2.1 * s, pal.gold || pal.band || bt);
  } else if (kit.weapon === 'book') {
    const r = ang * Math.PI / 180, cx = hand.x + Math.cos(r) * 6 * s, cy = hand.y + Math.sin(r) * 6 * s;
    rrect(a, cx, cy, 6.5 * s, 8 * s, r, pal.book.base);
    rrect(a, cx - 1.2 * s, cy, 5.2 * s, 7 * s, r, pal.paper.base);
    for (let i = -2; i <= 2; i++) { const p = { x: cx - 4 * s, y: cy + i * 2.2 * s }; put(a, p.x, p.y, pal.paper.sh); }
  } else if (kit.weapon === 'case') {
    const r = ang * Math.PI / 180, cx = hand.x + Math.cos(r) * 8 * s, cy = hand.y + Math.sin(r) * 8 * s;
    rrect(a, cx, cy, 7 * s, 5 * s, r, pal.case.base);
    rrect(a, cx - 1.2 * s, cy - 1 * s, 4.6 * s, 2 * s, r, pal.case.hi);
    put(a, cx, cy, pal.gold ? pal.gold.base : pal.case.sh);
  } else if (kit.weapon === 'bottle') {
    const r = ang * Math.PI / 180, hx2 = hand.x + Math.cos(r) * 7 * s, hy2 = hand.y + Math.sin(r) * 7 * s;
    capsule(a, hand.x, hand.y, hx2, hy2, 2.3 * s, 1.5 * s, pal.glass);
  }
}

/* ---------------- kit render ---------------- */
function renderFrame(kit, anim, fi) {
  const buf = newBuf(CW, CH);
  const poses = kit._poses || (kit._poses = Art.posesFor(kit));
  const list = poses[anim] || poses.idle;
  const P = list[Math.min(fi, list.length - 1)];
  kit._P = P; kit._f = fi;
  const J = solve(kit, P);
  const s = kit.b.s;
  /* two-handed weapons: pull the far hand onto the shaft so it can never float */
  if (kit.weapon === 'salami') {
    const r = (P.wpn || 0) * Math.PI / 180, L = 36 * s;
    const grip = { x: J.armF.ha.x + Math.cos(r) * L * .34, y: J.armF.ha.y + Math.sin(r) * L * .34 };
    gripArm(kit, J, grip);
  }
  /* weapon behind the body for windups */
  const wb = (P.wbehind || P.wpn < -115);
  if (wb) drawWeapon(buf, kit, J, P);
  arm(buf, kit, J.armB.sh, J.armB.el, J.armB.ha, kit.pal, true);
  leg(buf, kit, J.legB.hip, J.legB.kn, J.legB.an, kit.pal, true);
  drawTorso(buf, kit, J);
  head(buf, kit, J);
  leg(buf, kit, J.legF.hip, J.legF.kn, J.legF.an, kit.pal, false);
  arm(buf, kit, J.armF.sh, J.armF.el, J.armF.ha, kit.pal, false);
  if (!wb) drawWeapon(buf, kit, J, P);
  const outBuf = newBuf(CW, CH);
  /* apply body rotation for knockdown frames */
  if (P.rot) {
    const rad = P.rot * Math.PI / 180, cx = J.hip.x, cy = J.hip.y;
    const c = Math.cos(rad), sn = Math.sin(rad);
    for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
      const i = y * CW + x; if (!buf.m[i]) continue;
      const dx = x - cx, dy = y - cy;
      const nx = Math.round(cx + dx * c - dy * sn), ny = Math.round(cy + dx * sn + dy * c);
      if (nx < 0 || ny < 0 || nx >= CW || ny >= CH) continue;
      const k = ny * CW + nx; outBuf.d[k] = buf.d[i]; outBuf.m[k] = 1;
    }
  } else { outBuf.d.set(buf.d); outBuf.m.set(buf.m); }
  outline(outBuf, hex(OUT));
  return outBuf;
}

function trim(buf) {
  let x0 = buf.w, y0 = buf.h, x1 = -1, y1 = -1;
  for (let y = 0; y < buf.h; y++) for (let x = 0; x < buf.w; x++) {
    if (!buf.m[y * buf.w + x]) continue;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return { w: 1, h: 1, ox: 0, oy: 0, data: new Uint32Array([0]) };
  const w = x1 - x0 + 1, h = y1 - y0 + 1, data = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) data[y * w + x] = buf.d[(y + y0) * buf.w + (x + x0)];
  return { w: w, h: h, ox: x0 - AX, oy: y0 - AY, data: data };
}

/** Render every animation for a kit and return trimmed frames + timing. */
Art.buildKit = function (id) {
  const kit = KITS[id];
  const anims = kit.kind === 'hero' ? ANIMS.hero : ANIMS.enemy;
  const out = { id: id, name: kit.name, kind: kit.kind, anims: {} };
  anims.forEach(a => {
    const poses = (kit._poses = Art.posesFor(kit))[a] || POSE.idle;
    const frames = [];
    for (let i = 0; i < poses.length; i++) frames.push(trim(renderFrame(kit, a, i)));
    out.anims[a] = { timing: TIMING[a].slice(0, poses.length), frames: frames };
  });
  out.portrait = portrait(kit);
  return out;
};

/* ---------------- portraits ---------------- */
function portrait(kit) {
  const W = 48, H = 48, buf = newBuf(W, H);
  const mainC = kit.pal.coat || kit.pal.suit || kit.pal.denim || kit.pal.top || kit.pal.vest;
  const shirtC = kit.pal.shirt || kit.pal.tee || kit.pal.top || mainC;
  const k2 = Object.assign({}, kit, { _f: 0 });
  const P = p({ lean: 2, head: -3, sf: -30, ef: -50, sb: 30, eb: 50 });
  k2._P = P;
  const s = kit.b.s * 1.34;
  const J = { sh: { x: 24, y: 31 }, hip: { x: 24, y: 52 }, head: { x: 26, y: 18 }, armF: { el: { x: 20, y: 40 }, ha: { x: 17, y: 48 } }, armB: { el: { x: 30, y: 40 }, ha: { x: 34, y: 48 } }, lean: 2 };
  k2.b = Object.assign({}, kit.b, { s: s });
  k2._P = Object.assign({}, P, { wpn: -90 });
  /* shoulders + chest */
  poly(buf, [[8, H], [12, 33], [22, 30], [26, 30], [36, 33], [40, H]], mainC.base);
  if (kit.id === 'ricky') {
    for (let i = 0; i < 6; i++) disc(buf, 12 + i * 5, 33 + (i % 2), 2.6, i % 2 ? kit.pal.fleece.base : kit.pal.fleece.hi);
    rect(buf, 14, 38, 22, 2, kit.pal.fleece.sh);
    poly(buf, [[20, 34], [28, 34], [26, H], [22, H]], kit.pal.shirt.base);
  } else if (kit.id === 'vv') {
    rect(buf, 10, 34, 28, 2, kit.skin.base);
    rect(buf, 12, 38, 24, 2, kit.pal.belt.base);
  } else if (kit.id === 'johnny') {
    poly(buf, [[20, 33], [28, 33], [30, H], [18, H]], kit.pal.tee.base);
    poly(buf, [[8, H], [12, 33], [20, 33], [18, H]], kit.pal.denim.base);
    poly(buf, [[40, H], [36, 33], [28, 33], [30, H]], kit.pal.denim.base);
  } else {
    poly(buf, [[20, 33], [28, 33], [29, H], [19, H]], shirtC.base);
    if (kit.pal.tie) poly(buf, [[22.5, 35], [25.5, 35], [25, 46], [23, 46]], kit.pal.tie.base);
  }
  /* head bigger, centred */
  const hk = Object.assign({}, kit, { b: Object.assign({}, kit.b, { s: s, headR: kit.b.headR * 1.12 }) });
  hk._P = Object.assign({}, P, { head: -4 });
  hk._f = 0;
  const HJ = { sh: { x: 24, y: 30 }, hip: { x: 24, y: 54 }, head: { x: 25, y: 20 }, lean: 4 };
  head(buf, hk, HJ);
  outline(buf, hex(OUT));
  const t = trim(buf);
  t.data = scale2(t.data, t.w, t.h);
  return { w: t.w * 2, h: t.h * 2, ox: t.ox, oy: t.oy, data: t.data };
}
function scale2(data, w, h) {
  const out = new Uint32Array(w * 2 * h * 2);
  for (let y = 0; y < h * 2; y++) for (let x = 0; x < w * 2; x++) out[y * w * 2 + x] = data[(y >> 1) * w + (x >> 1)];
  return out;
}

    if (G.Input.just('p1', 'start') || G.Input.just('p1', 'attack')) c.waiting = true;
    if (G.Input.just('p1', 'back')) this.cfg = null;
  }
  goto(s) {
    this.screen = s; this.menu = 0; this.sub = 0;
    if (this.net && s === 'title') this.net.leave();
    if (s === 'title' && this.audio) this.audio.music('title');
  }
  onBack() {
    const s = this.screen;
    if (s === 'title') return;
    if (s === 'play') { this.pause(); return; }
    if (s === 'pause') { this.resume(); return; }
    if (s === 'select') { this.goto('main'); return; }
    if (s === 'lobby') { this.leaveOnline(); return; }
    if (s === 'join' || s === 'online' || s === 'settings' || s === 'credits' || s === 'howto' || s === 'modes') { this.goto('main'); return; }
    if (s === 'clear') { this.nextStage(); return; }
    if (s === 'over' || s === 'victory') { this.goto('title'); return; }
    if (this.cfg) { this.cfg = null; return; }
  }
  navSelect() {
    const n = G.CH_ORDER.length;
    if (G.Input.just('p1', 'left')) { this.sel = (this.sel + n - 1) % n; this.blip(); }
    if (G.Input.just('p1', 'right')) { this.sel = (this.sel + 1) % n; this.blip(); }
    if (this.mode === 'local') {
      if (G.Input.just('p2', 'left')) { this.selP2 = (this.selP2 + n - 1) % n; this.blip(); }
      if (G.Input.just('p2', 'right')) { this.selP2 = (this.selP2 + 1) % n; this.blip(); }
    }
    if (G.Input.just('p1', 'start') || G.Input.just('p1', 'attack')) {
      this.p1 = G.CH_ORDER[this.sel];
      this.p2 = this.mode === 'local' ? G.CH_ORDER[this.selP2 === this.sel ? (this.selP2 + 1) % n : this.selP2] : 'vv';
      if (this.mode === 'online') { this.beginOnlineLobby(); return; }
      this.newGame(this.mode, { stage: this.settings.stage | 0 });
      this.blip(true);
    }
  }
  navPause() {
    const rows = ['pause_resume', 'pause_restart', 'pause_settings', 'pause_howto', 'pause_quit'];
    if (this.mode === 'online' && !this.isHost()) return;    /* guest waits for the host */
    if (G.Input.just('p1', 'up')) { this.menu = (this.menu + rows.length - 1) % rows.length; this.blip(); }
    if (G.Input.just('p1', 'down')) { this.menu = (this.menu + 1) % rows.length; this.blip(); }
    if (G.Input.just('p1', 'start') || G.Input.just('p1', 'attack')) {
      if (this.menu === 0) this.resume();
      else if (this.menu === 1) { this.restartStage(); }
      else if (this.menu === 2) { this.pauseHost = true; this.goto('settings'); this.returnScreen = 'pause'; }
      else if (this.menu === 3) { this.returnScreen = 'pause'; this.goto('howto'); }
      else { this.goto('title'); }
      this.blip(true);
    }
  }
  navOver() {
    const rows = ['over_continue', 'over_title_btn'];
    if (G.Input.just('p1', 'up') || G.Input.just('p1', 'left')) { this.menu = 0; this.blip(); }
    if (G.Input.just('p1', 'down') || G.Input.just('p1', 'right')) { this.menu = 1; this.blip(); }
    if (G.Input.just('p1', 'start') || G.Input.just('p1', 'attack')) {
      if (this.menu === 0) { this.lives = 3; this.newGame(this.mode, { stage: this.stageIdx }); }
      else this.goto('title');
      this.blip(true);
    }
  }
  blip(big) { if (this.audio) this.audio.sfx(big ? 'go' : 'ui'); }
  toastMsg(s) { this.toast = s; this.toastT = 100; }

  /* ---------------- play loop ---------------- */
  pause() {
    if (this.screen !== 'play') return;
    if (this.mode === 'online' && !this.isHost()) { this.toastMsg(this.tr('pause_waiting')); if (this.net) this.net.requestPause(true); return; }
    this.screen = 'pause'; this.menu = 0;
    if (this.audio) this.audio.duck(true);
    if (this.net) this.net.sendPause(true);
  }
  resume() {
    this.screen = 'play'; this.menu = 0;
    if (this.audio) this.audio.duck(false);
    if (this.net) this.net.sendPause(false);
    G.Input.clear();
  }
  restartStage() {
    if (this.net && this.mode === 'online' && !this.isHost()) { this.net.requestRestart(); return; }
    this.carry = null; this.lives = Math.max(3, this.lives);
    this.newGame(this.mode, { stage: this.stageIdx });
    if (this.net) this.net.sendRestart(this);
  }
  nextStage() {
    if (this.net && this.mode === 'online' && !this.isHost()) return;
    if (this.stageIdx >= G.STAGES.length - 1) { this.goto('victory'); return; }
    const keep = this.players.map(p => ({ charId: p.charId, hp: p.hp, hype: p.hype }));
    this.stageIdx++;
    this.loadStage(this.stageIdx);
    this.players.forEach((p, k) => { const s = keep[k]; if (s) { p.hp = Math.max(p.maxhp * .6, s.hp + p.maxhp * .25); p.hype = Math.max(35, s.hype); } });
    this.lives = Math.max(this.lives, 2);
    this.screen = 'play'; this.banner = 150;
    if (this.audio) this.audio.music(G.STAGES[this.stageIdx].music);
    if (this.net) this.net.sendRestart(this);
  }
  updatePlay() {
    if (this.screen === 'play') {
      if (this.training) {
        if (G.Input.just('p1', 'pause')) { this.goto('title'); return; }
        if (G.Input.consume('p1', 'grab') && G.Input.held.p1.up) this.resetDummy();
      }
      if (this.hitstop > 0) { this.hitstop--; this.shake *= .9; return; }
      this.tick++;
      for (const p of this.players) this.updatePlayer(p);
      for (const e of this.enemies) this.updateEnemy(e);
      this.separate();
      this.updateProjs();
      this.props.forEach(p => { if (p.shake > 0) p.shake--; });
      this.updateItems(); this.updateFx();
      if (!this.training) this.updateWaves();
      this.updateCamera();
      this.enemies = this.enemies.filter(e => !e.remove);
      this.props = this.props.filter(p => !p.remove);
      if (this.banner > 0) this.banner--;
      if (this.shake > 0) this.shake *= .86;
      if (this.shake < .2) this.shake = 0;
      if (this.flashT > 0) this.flashT--;
      if (this.combo.t > 0) { this.combo.t--; if (!this.combo.t) this.combo.n = 0; }
      if (this.combo.pop > 0) this.combo.pop -= .6;
      if (this.training) this.enemies.forEach(e => { if (e.hp < 1) e.hp = e.maxhp; });
      this.checkDefeat();
    } else if (this.hitstop > 0) this.hitstop--;
  }
  checkDefeat() {
    if (this.training) return;
    const live = this.players.filter(p => !p.dead && p.state !== 'downed');
    if (live.length) return;
    if (this.mode !== 'solo' && this.lives > 0 && this.players.some(p => p.state === 'downed')) return;
    this.screen = 'over'; this.menu = 0;
    if (this.audio) this.audio.sfx('ko');
    if (this.net && this.isHost()) this.net.sendOver(this);
  }

  /* ---------------- fighters ---------------- */
  updatePlayer(p) {
    if (p.dead) { this.advance(p, false); return; }
    if (p.invuln > 0) p.invuln--;
    if (p.flash > 0) p.flash--;
    if (p.chainTimer > 0 && --p.chainTimer === 0) p.hitChain = 0;
    this.settle(p);
    switch (p.state) {
      case 'idle': case 'walk': this.playerGround(p); break;
      case 'attack': this.playerAttack(p); break;
      case 'jump': case 'jatk': case 'jdown': this.playerAir(p); break;
      case 'land': this.advance(p, false); p.vx *= .8; p.vy *= .8; if (p.done) { p.state = 'idle'; this.setAnim(p, 'idle'); } break;
      case 'special': this.playerSpecial(p); break;
      case 'grab': case 'gstrike': case 'throw': this.playerGrab(p); break;
      case 'hit': this.advance(p, false); p.x += p.vx; p.vx *= .86; p.y += p.vy; p.vy *= .86; if (--p.stun <= 0) { p.state = 'idle'; this.setAnim(p, 'idle'); } break;
      case 'knock': this.knockStep(p); break;
      case 'down': this.downStep(p, 46); break;
      case 'downed': this.downedStep(p); break;
      case 'getup': this.advance(p, false); if (p.done) { p.state = 'idle'; this.setAnim(p, 'idle'); } break;
      case 'dead': this.advance(p, false); break;
      case 'win': this.advance(p, true); break;
    }
    if (p.state !== 'down' && p.state !== 'downed' && p.state !== 'knock') {
      p.x = clamp(p.x, this.cam.x + 10, Math.min(this.cam.x + G.LW - 10, this.stage.len - 10));
      p.y = clamp(p.y, FT, FB);
    }
    this.pickupCheck(p);
  }
  settle(e) { if (e.z > 0 && !['knock', 'jump', 'jatk', 'jdown', 'down', 'downed', 'dead'].includes(e.state)) { e.vz -= GRAV; e.z += e.vz; if (e.z <= 0) { e.z = 0; e.vz = 0; } } }
  playerGround(p) {

    if (this.consume('jump', p.pid) && p.state !== 'land') { p.state = 'jump'; p.vz = JUMPV; p.vx *= .9; p.vy *= .6; this.setAnim(p, 'jump'); if (this.audio) this.audio.sfx('jump'); return; }
    if (this.consume('special', p.pid) && p.hype > 3) { this.startSpecial(p); return; }
    if (this.consume('attack', p.pid)) { this.startAttack(p, p.chainTimer > 0 && p.step < 2 ? p.step + 1 : 0); return; }
    if (this.consume('grab', p.pid)) { this.tryGrab(p); if (p.state === 'grab') return; }

    let tx = ax * spd, ty = ay * WALKY * (p.def.spd);

    p.vx += (tx - p.vx) * .45; p.vy += (ty - p.vy) * .45;
    if (Math.abs(p.vx) < .06) p.vx = 0;
    if (Math.abs(p.vy) < .06) p.vy = 0;
    p.x += p.vx; p.y += p.vy;
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > .25) {

    } else { if (p.state === 'walk') { p.state = 'idle'; this.setAnim(p, 'idle'); } this.advance(p, true); }
  }
  walkPhase(e, sp) { e.phase = (e.phase + sp / e.stride) % 1; e.frame = Math.floor(e.phase * 8) % 8; }
  startAttack(p, step) {

  playerAttack(p) {

    this.advance(p, false);
    p.x += p.vx; p.vx *= .78;

    }
    if (p.done) {

      const next = p.queued && p.step < 2 ? p.step + 1 : 0;
      p.queued = false;
      p.chainTimer = next ? 16 : 0;
      p.step = next;

  }
  playerAir(p) {
    const ax = this.axisX(p.pid), ay = this.axisY(p.pid);
    p.vz -= GRAV; p.z += p.vz;
    p.vx += (ax * p.baseSpd * .9 - p.vx) * .08; p.vy += (ay * .8 - p.vy) * .08;
    p.x += p.vx; p.y += p.vy;
    if (p.state === 'jump') {

      if (this.consume('attack', p.pid)) {
        p.hitSet = new Set();
        if (ay > 0) { p.state = 'jdown'; this.restartAnim(p, 'jdown'); p.vz = Math.min(p.vz, -2); }
        else { p.state = 'jatk'; this.restartAnim(p, 'jatk'); }
        if (this.audio) this.audio.sfx('swing');
      }
    } else {
      this.advance(p, false);
      const air = p.state === 'jatk'
        ? { box: { x0: 0, x1: 46, tol: 16, z0: p.z - 20, z1: p.z + 26 }, dmg: 7, kb: 1.8, stun: 16, hs: 4, hype: 4, active: [0, 1, 2] }
        : { box: { x0: -6, x1: 36, tol: 16, z0: 0, z1: p.z + 20 }, dmg: 10, kb: 2.6, stun: 20, hs: 5, hype: 5, knock: true, launch: 2.4, active: [0, 1] };
      air.box.z0 += p.z; air.box.z1 += p.z;
      if (air.active.includes(p.frame)) this.strike(p, air, p.hitSet);
    }
    if (p.z <= 0 && p.vz < 0) {
      p.z = 0; p.vz = 0; p.state = 'land'; this.restartAnim(p, 'land');
      this.dust(p.x, p.y, 2); if (this.audio) this.audio.sfx('land');
    }
  }
  startSpecial(p) {
    p.state = 'special'; p.spT = 0; p.pulses = 0; p.vx = p.vy = 0; p.hitSet = new Set();
    this.restartAnim(p, 'special');
    if (this.audio) this.audio.sfx('special');
    this.fx.push({ type: 'ring', x: p.x, y: p.y, z: 6, life: 18, age: 0 });
  }
  playerSpecial(p) {
    if (!this.held('special', p.pid) || p.hype <= 0) { p.state = 'idle'; this.setAnim(p, 'idle'); return; }
    p.hype = Math.max(0, p.hype - DRAIN);
    this.advance(p, true); p.spT++;
    const sp = p.def.spec;
    if (p.spT % sp.every === 1) { p.hitSet = new Set(); p.pulses++; }
    if (p.spT % sp.every < 4) this.strike(p, sp, p.hitSet, { special: true, knock: p.pulses % sp.knockEvery === 0, launch: 2.6 });
    if (p.spT % 9 === 0) this.fx.push({ type: 'ring', x: p.x + p.face * 26, y: p.y, z: 20, life: 12, age: 0 });
  }
  tryGrab(p) {
    let best = null, bd = 1e9;
    for (const e of this.enemies) {
      if (!this.grabbable(e)) continue;
      const dx = (e.x - p.x) * p.face;
      if (dx < -8 || dx > 34 || Math.abs(e.y - p.y) > 13) continue;
      if (dx < bd) { bd = dx; best = e; }
    }
    if (!best) return;
    p.state = 'grab'; p.held = best; p.grabT = 0; p.gcount = 0; this.restartAnim(p, 'grab');
    p.vx = p.vy = 0;
    best.state = 'held'; best.heldBy = p; best.grabT = 0; best.atk = null; best.armor = false; best.warn = false;
    if (this.audio) this.audio.sfx('grab');
  }
  grabbable(e) {

    if (['idle', 'walk', 'hit', 'stun'].includes(e.state)) return true;
    return e.state === 'attack' && e.atk && e.atk.phase === 'windup' && !e.def.boss;
  }
  releaseHold(p) { const e = p.held; if (e) { e.heldBy = null; if (e.state === 'held') { e.state = 'idle'; e.cool = 40; this.setAnim(e, 'idle'); } } p.held = null; }
  playerGrab(p) {
    const e = p.held;
    if (!e || e.state !== 'held') { p.held = null; p.state = 'idle'; this.setAnim(p, 'idle'); return; }
    e.x += (p.x + p.face * 20 - e.x) * .45; e.y += (p.y - e.y) * .45; e.face = -p.face; e.grabT++;
    if (e.grabT > (e.def.boss ? 80 : 130)) { this.releaseHold(p); p.state = 'idle'; p.invuln = 14; return; }
    if (p.state === 'grab') {
      this.advance(p, true);
      if (this.consume('attack', p.pid)) { p.state = 'gstrike'; this.restartAnim(p, 'gstrike'); p.struck = false; }
      else if (this.consume('grab', p.pid) || this.consume('jump', p.pid)) {
        const ax = this.axisX(p.pid); if (ax) p.face = ax;
        p.state = 'throw'; this.restartAnim(p, 'throw'); p.thrown = false;
      }
    } else if (p.state === 'gstrike') {
      this.advance(p, false);
      if (p.frame >= 1 && !p.struck) {
        p.struck = true;
        p.gcount++;
        const strike = { dmg: p.gcount % 3 === 0 ? 10 : 5, kb: .5, stun: 22, hs: 4, hype: 5, knock: p.gcount % 3 === 0, launch: 2.6 };
        this.hurt(e, p, strike, { grab: true });
        if (p.gcount % 3 === 0 || e.state !== 'held') { p.held = null; e.heldBy = null; }
      }
      if (p.done) { p.state = p.held ? 'grab' : 'idle'; this.restartAnim(p, p.held ? 'grab' : 'idle'); }
    } else if (p.state === 'throw') {
      this.advance(p, false);
      if (p.frame >= 1 && !p.thrown) {
        p.thrown = true;
        e.x = p.x + p.face * 16; e.z = 18; e.face = -p.face;
        e.heldBy = null; p.held = null;
        this.hurt(e, p, { dmg: 11, kb: 0, stun: 20, hs: 5, hype: 8, knock: true, launch: 1 }, { throwStart: true });
        e.vx = p.face * 5.2; e.vz = 3.2; e.thrown = true; e.thrownHit = new Set([e]); e.owner = p;
        if (this.audio) this.audio.sfx('throw');
      }
      if (p.done) { p.state = 'idle'; this.setAnim(p, 'idle'); }
    }
  }
  knockStep(e) {
    e.vz -= GRAV; e.z += e.vz; e.x += e.vx; e.y = clamp(e.y + (e.vy || 0), FT, FB); e.vx *= .985;
    if (e.team === 'p') e.x = clamp(e.x, this.cam.x + 6, this.cam.x + G.LW - 6);
    e.anim = 'knock'; e.frame = (e.vz > 0 || e.z > 16) ? 0 : 1;
    if (e.thrown && e.team === 'e') {
      const mv = { box: { x0: -16, x1: 16, tol: 13, z0: 0, z1: 50 }, dmg: 9, kb: 2.4, stun: 22, hs: 5, hype: 0, knock: true, launch: 2.2, owner: e.owner };
      this.strike(e, mv, e.thrownHit);
    }
    if (e.z <= 0 && e.vz < 0) {
      e.z = 0; e.vz = 0; e.vx *= .4; e.thrown = false;
      e.state = e.hp <= 0 ? 'dead' : 'down'; e.downT = 0;
      this.restartAnim(e, e.hp <= 0 ? 'dead' : 'down');
      this.dust(e.x, e.y, 3); this.shake = Math.max(this.shake, 2.4); if (this.audio) this.audio.sfx('land');

    }
  }
  downStep(e, wait) {
    e.downT++; e.x += e.vx; e.vx *= .86;
    e.anim = 'down'; e.frame = e.downT < 12 ? 0 : 1;
    if (e.team === 'p') e.x = clamp(e.x, this.cam.x + 8, this.cam.x + G.LW - 8);
    if (e.downT > wait) {
      if (e.team === 'e') { e.state = 'getup'; this.restartAnim(e, 'getup'); e.invuln = 30; }
      else { e.state = 'idle'; this.setAnim(e, 'idle'); e.invuln = 50; }
    }
  }
  downedStep(p) {
    p.downT++;
    p.anim = 'down'; p.frame = 1;
    const partner = this.players.find(o => o !== p && !o.dead && o.state !== 'downed');
    if (partner && this.lives > 0) {
      const near = Math.abs(partner.x - p.x) < 34 && Math.abs(partner.y - p.y) < 22;
      p.reviveT = near ? (p.reviveT || 0) + 1 : 0;
      if (p.reviveT > 80) {
        this.lives--;
        p.state = 'idle'; p.dead = false; p.hp = Math.round(p.maxhp * .55); p.invuln = 120; p.downT = 0;
        this.setAnim(p, 'idle');
        this.fx.push({ type: 'heal', x: p.x, y: p.y, z: 30, life: 26, age: 0 });
        if (this.audio) this.audio.sfx('pick');
        return;
      }
    }
    if (p.downT > 420) {
      p.dead = true; p.state = 'dead'; this.lives--;
      if (this.lives <= 0) { this.screen = 'over'; this.menu = 0; if (this.audio) this.audio.sfx('ko'); }
    }
  }
  playerDowned(p) {
    if (this.mode === 'solo' || this.training) {
      if (this.lives > 1) {
        this.lives--; p.hp = p.maxhp; p.state = 'idle'; p.invuln = 150; p.hitChain = 0; p.z = 0;
        p.x = this.cam.x + 80; p.y = 200; this.setAnim(p, 'idle'); this.dust(p.x, p.y, 4);
        return;
      }
      this.lives--;
      p.state = 'dead'; p.dead = true;
      this.screen = 'over'; this.menu = 0;
      if (this.audio) this.audio.sfx('ko');
      if (this.net && this.isHost()) this.net.sendOver(this);

  }
  /* ---------------- hit detection ---------------- */
  strike(att, mv, hitSet, extra) {

    /* a thrown enemy keeps the thrower's allegiance: friendly bowling only */

  /* ---------------- enemies ---------------- */

  updateTokens() {

function wrap(ctx, str, x, y, w, size, col, align) {
  const words = String(str).split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (tw(test, size) > w && line) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => T(ctx, l, x, y + i * (size + 3), size, col, align));
  return lines.length;
}

/* Browser bootstrap: asset loading, integer-scaled canvas, fixed 60Hz loop,

const view = document.getElementById('view');

   come from the same build, otherwise cached offsets point into new pixels and
   fighters render as garbage. */

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const availW = window.innerWidth, availH = window.innerHeight;
  /* fractional fit so portrait/narrow screens use their full width; the
     canvas is upscaled with pixelated CSS so pixels stay hard */
  scale = Math.max(.5, Math.min(availW / LW, availH / LH));
  view.width = Math.round(LW * scale * dpr); view.height = Math.round(LH * scale * dpr);
  const cssW = view.width / dpr, cssH = view.height / dpr;
  view.style.width = cssW + 'px'; view.style.height = cssH + 'px';

  const v = view.getContext('2d');
  v.imageSmoothingEnabled = false;
  v.fillStyle = '#07050c'; v.fillRect(0, 0, view.width, view.height);
  if (game.screen === 'play' || game.screen === 'pause' || game.screen === 'clear' || game.screen === 'over' || game.screen === 'victory') {
    const shake = game.settings.shake && game.shake > .3 && game.screen === 'play' ? game.shake : 0;
    const ox = shake ? Math.round((Math.random() * 2 - 1) * shake) : 0;
    const oy = shake ? Math.round((Math.random() * 2 - 1) * shake * .6) : 0;
